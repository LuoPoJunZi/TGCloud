name: actions-retention

on:
  workflow_run:
    workflows:
      - Compose deployment bundles
      - docs-quality
      - release
      - repository-quality
      - tests
      - VPS installer checks
    types:
      - completed
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      keep:
        description: "Maximum number of workflow runs to retain"
        required: false
        default: "100"
        type: string

permissions: {}

concurrency:
  group: actions-retention
  cancel-in-progress: false

jobs:
  prune-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      KEEP_INPUT: ${{ inputs.keep }}
    steps:
      - name: Prune completed workflow runs beyond retention limit
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          current_id = int(os.environ["CURRENT_RUN_ID"])
          raw_keep = (os.environ.get("KEEP_INPUT") or "100").strip()
          keep = int(raw_keep)
          if not 1 <= keep <= 1000:
              raise SystemExit(f"keep must be between 1 and 1000, got {keep}")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "User-Agent": "TGCloud-Actions-Retention",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          seen = set()
          all_runs = []
          for page in range(1, 51):
              url = f"https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  payload = json.loads(resp.read().decode("utf-8"))
              batch = payload.get("workflow_runs") or []
              for run in batch:
                  run_id = int(run["id"])
                  if run_id not in seen:
                      seen.add(run_id)
                      all_runs.append(run)
              if len(batch) < 100:
                  break

          def is_old_self(run: dict) -> bool:
              return (
                  int(run["id"]) != current_id
                  and run.get("status") == "completed"
                  and run.get("path") == ".github/workflows/actions-retention.yml"
              )

          kept_candidates = [run for run in all_runs if not is_old_self(run)]
          keep_ids = {int(run["id"]) for run in kept_candidates[:keep]}

          to_delete = [
              int(run["id"])
              for run in all_runs
              if int(run["id"]) != current_id
              and int(run["id"]) not in keep_ids
              and run.get("status") == "completed"
          ]

          deleted = 0
          for run_id in to_delete:
              del_url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              req = urllib.request.Request(del_url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req, timeout=30):
                      deleted += 1
              except urllib.error.HTTPError as exc:
                  if exc.code not in (403, 404, 422):
                      raise
                  print(f"Skipped run {run_id}: HTTP {exc.code}")

          print(f"Scanned={len(all_runs)} Deleted={deleted} TargetKeep={keep}")
          PY
