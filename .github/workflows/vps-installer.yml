permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  offline-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install lint tools only
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          locked = Path("requirements/dev.lock.txt").read_text(encoding="utf-8")
          pins = []
          for name in ("ruff", "bandit"):
              matches = re.findall(rf"(?m)^{name}==[0-9.]+", locked)
              if len(matches) != 1:
                  raise ValueError(f"Expected exactly one locked {name} version")
              pins.append(matches[0])
          subprocess.run([sys.executable, "-m", "pip", "install", *pins], check=True)
          PY
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Shell syntax and lint
        run: |
          bash -n install.sh
          shellcheck install.sh
      - name: Offline tests (no VPS or Docker calls)
        run: |
          python .github/scripts/check_python.py test --scope cli
      - name: Isolated LAN Nginx checks (no product deployment)
        if: matrix.python == '3.13'
        env:
          TGCLOUD_TEST_LAN_DOCKER: "1"
        run: |
          python -B -m tgcloud.deployment.architecture docker
          python -B -m unittest tests.integration.test_lan_gateway_docker -v
      - name: Python lint and syntax
        run: |
          python .github/scripts/check_python.py lint --scope cli
          python .github/scripts/check_python.py compile --scope cli
          bandit -q -r scripts
      - name: Whitespace check
        run: git diff --check
